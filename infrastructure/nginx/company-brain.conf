# Company Brain — nginx reverse proxy (subdomain layout)
#
#   brain.example.com      → web dashboard  (127.0.0.1:3000)
#   api.brain.example.com  → API + WebSocket (127.0.0.1:4000)
#
# Install:
#   sudo cp infrastructure/nginx/company-brain.conf /etc/nginx/sites-available/company-brain.conf
#   sudo ln -s /etc/nginx/sites-available/company-brain.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Add HTTPS (Let's Encrypt) — certbot rewrites these blocks for TLS + redirect:
#   sudo certbot --nginx -d brain.example.com -d api.brain.example.com
#
# Replace brain.example.com / api.brain.example.com with your domains, and set
# these in .env to match (then rebuild the web image so the URL re-bakes):
#   PUBLIC_API_URL=https://api.brain.example.com
#   WEB_APP_URL=https://brain.example.com
#   API_CORS_ORIGINS=https://brain.example.com
#   GOOGLE_REDIRECT_URI=https://api.brain.example.com/api/v1/auth/google/callback

# Map the Upgrade header so WebSocket connections (live events, meeting streams)
# are proxied correctly; falls back to "close" for normal requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Web dashboard ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name brain.example.com;

    # Next.js document uploads pass through the API, but keep the web side roomy.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── API + WebSocket ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.brain.example.com;

    # Matches the API's UPLOAD_MAX_FILE_SIZE_MB (default 50) with headroom.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # WebSocket upgrade for /api/v1/live and /api/v1/meetings/:id/live.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeout so streamed WebSocket connections aren't cut every 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
